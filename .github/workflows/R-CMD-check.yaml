# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          # - {os: ubuntu-latest,   r: 'release'}
          - {os: windows-latest, r: '4.5.2'}
          - {os: windows-2022, r: '4.5.2'}
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          # - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package timestamps
        shell: Rscript {0}
        run: |
          x <- list.files(
            ".",
            recursive = TRUE,
            all.files = TRUE,
            full.names = TRUE,
            include.dirs = TRUE
          )

          z <- file.info(x)

          # R's internal tar writer ultimately stores mtime
          # as an integer in the tar header.
          mtime_int <- suppressWarnings(as.integer(as.numeric(z$mtime)))

          bad <- is.na(mtime_int)

          cat("Oldest timestamps:\n")
          o <- order(z$mtime)
          print(
            head(
              data.frame(
                file = x[o],
                mtime = z$mtime[o]
              ),
              20
            )
          )

          cat("\nNewest timestamps:\n")
          print(
            tail(
              data.frame(
                file = x[o],
                mtime = z$mtime[o]
              ),
              20
            )
          )

          if (any(bad)) {
            cat("\nFiles with invalid tar-compatible mtimes:\n")
            print(
              data.frame(
                file = x[bad],
                mtime = z$mtime[bad]
              )
            )

            stop("Files with invalid tar-compatible mtimes found")
          }

          cat("\nAll source timestamps fit in a 32-bit tar mtime\n")


      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
