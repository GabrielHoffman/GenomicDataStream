# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          # - {os: ubuntu-latest,   r: 'release'}
          # - {os: windows-latest, r: '4.5.2'}
          - {os: windows-2022, r: '4.5.2'}
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          # - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package timestamps
        shell: Rscript {0}
        run: |
          paths <- list.files(
            ".",
            recursive = TRUE,
            all.files = TRUE,
            full.names = TRUE,
            include.dirs = TRUE
          )

          paths <- paths[!grepl(
            paste0("^", normalizePath(".git", mustWork = FALSE)),
            normalizePath(paths, mustWork = FALSE),
            fixed = TRUE
          )]

          mtimes <- as.numeric(file.info(paths)$mtime)

          # POSIX tar stores mtime as a signed 32-bit value.
          invalid <- is.na(mtimes) | mtimes < 0 | mtimes > 2147483647

          if (any(invalid)) {
            print(data.frame(
              file = paths[invalid],
              mtime = as.POSIXct(mtimes[invalid], origin = "1970-01-01", tz = "UTC")
            ))
            stop("Files with timestamps outside the POSIX tar range were found")
          }

          cat("All source timestamps are tar-compatible\n")

      - name: Build package for tar diagnostics
        shell: Rscript {0}
        run: |
          status <- system2(
            file.path(R.home("bin"), "R"),
            c("CMD", "build", ".", "--no-manual",
              "--compact-vignettes=gs+qpdf")
          )
          if (status != 0)
            stop("R CMD build failed")

      - name: Inspect tar headers
        shell: python
        run: |
          import glob
          import gzip
          import math

          files = glob.glob("GenomicDataStream_*.tar.gz")

          if not files:
              raise RuntimeError("No package tarball found")

          tarfile = files[-1]
          print("Inspecting:", tarfile)

          def octal_field(field):
              # R's internal untar permits spaces, NUL and digits 0..7.
              for b in field:
                  if b == 0:
                      break
                  if b == 32:
                      continue
                  if b < ord("0") or b > ord("7"):
                      return False
              return True

          def parse_octal(field):
              x = field.split(b"\0", 1)[0].strip()
              return int(x or b"0", 8)

          with gzip.open(tarfile, "rb") as f:
              entry = 0
              previous = None

              while True:
                  offset = f.tell()
                  block = f.read(512)

                  if not block:
                      break

                  if len(block) != 512:
                      raise RuntimeError(
                          f"Incomplete header at offset {offset}"
                      )

                  if block == b"\0" * 512:
                      break

                  entry += 1

                  name = block[0:100].split(b"\0", 1)[0]
                  prefix = block[345:500].split(b"\0", 1)[0]

                  if prefix:
                      fullname = prefix + b"/" + name
                  else:
                      fullname = name

                  name_string = fullname.decode(
                      "utf-8", errors="replace"
                  )

                  size_field  = block[124:136]
                  mtime_field = block[136:148]
                  typeflag    = block[156:157]

                  if not octal_field(size_field):
                      print("\nBAD SIZE FIELD")
                      print("entry:", entry)
                      print("offset:", offset)
                      print("name:", name_string)
                      print("raw size:", repr(size_field))
                      raise RuntimeError("Invalid tar size field")

                  if not octal_field(mtime_field):
                      print("\nBAD MTIME FIELD")
                      print("entry:", entry)
                      print("offset:", offset)
                      print("name:", name_string)
                      print("type:", repr(typeflag))
                      print("raw mtime:", repr(mtime_field))

                      if previous:
                          print("\nPrevious entry:")
                          print(previous)

                      raise RuntimeError(
                          "Found malformed tar mtime header"
                      )

                  size = parse_octal(size_field)

                  previous = {
                      "entry": entry,
                      "name": name_string,
                      "size": size,
                      "mtime_raw": repr(mtime_field),
                      "type": repr(typeflag)
                  }

                  # Skip file contents, padded to 512-byte boundary.
                  skip = math.ceil(size / 512) * 512
                  if skip:
                      f.seek(skip, 1)

          print("All tar headers passed inspection")
          
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
